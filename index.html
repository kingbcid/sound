<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091323"><title>KING Sound Control V2.3</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><style id="king-home-nav-style">.king-home-nav{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:1px solid #52617a;border-radius:10px;background:#18263b;color:#f5f8ff!important;font:700 12px/1.2 system-ui,sans-serif;text-decoration:none!important;white-space:nowrap;cursor:pointer;min-height:34px;box-sizing:border-box}.king-home-nav:hover{background:#263b56;border-color:#ffb34c}.king-home-nav:focus-visible,.king-home-logo:focus-visible{outline:2px solid #ffb34c;outline-offset:3px}.king-home-logo{display:inline-flex;align-items:center;text-decoration:none!important;color:inherit!important;min-width:0}.king-home-logo img{display:block}.king-nav-actions{display:inline-flex;align-items:center;gap:9px;flex-shrink:0}.king-nav-actions .king-home-nav{margin:0}@media(max-width:680px){.king-home-nav{padding:7px 9px;font-size:11px}.king-nav-actions{gap:5px}}</style></head><body><div class="app"><header class="top"><div class="brand"><a class="king-home-logo" href="https://kingbcid.github.io/" title="Kembali ke Main Menu" aria-label="Kembali ke Main Menu"><img src="king-logo.png" alt="KING" class="logo"></a><div><div class="eyebrow">KING BASKETBALL COMMUNITY <span class="version">/ SOUND CONTROL V2.3</span></div><h1>Sound Control <span class="accent">●</span></h1></div></div><div class="tools"><a class="king-home-nav" href="https://kingbcid.github.io/">⌂ Main Menu</a><span id="playingCount" class="playing-count">0 PLAYING</span><label class="volume"><span>VOLUME</span><input id="volume" aria-label="Master volume" type="range" min="0" max="100" value="80"><strong id="volumeValue">80%</strong></label><button id="mute" class="toolbtn" type="button">Mute</button><button id="stopAll" class="toolbtn danger" type="button">■ STOP ALL <kbd>ESC</kbd></button></div></header><main id="board" class="board" aria-label="Soundboard berdasarkan kategori"></main><footer><span>24 SLOTS · 18 ACTIVE · 6 MUSIC SLOTS READY</span><span id="status" aria-live="polite">Ready</span><span>POWERED BY KING BASKETBALL COMMUNITY</span></footer></div><script src="app.js"></script><script id="king-home-nav-script">document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-king-home-confirm]').forEach(function(a){a.addEventListener('click',function(e){if(!window.confirm('Kembali ke Main Menu KING?\nPastikan data pertandingan sudah tersimpan.'))e.preventDefault();});});});</script></body></html>
