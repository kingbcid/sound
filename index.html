<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091323"><title>KING Sound Control V2.3</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><div class="brand"><img src="king-logo.png" alt="KING" class="logo"><div><div class="eyebrow">KING BASKETBALL COMMUNITY <span class="version">/ SOUND CONTROL V2.3</span></div><h1>Sound Control <span class="accent">●</span></h1></div></div><div class="tools"><span id="playingCount" class="playing-count">0 PLAYING</span><label class="volume"><span>VOLUME</span><input id="volume" aria-label="Master volume" type="range" min="0" max="100" value="80"><strong id="volumeValue">80%</strong></label><button id="mute" class="toolbtn" type="button">Mute</button><button id="stopAll" class="toolbtn danger" type="button">■ STOP ALL <kbd>ESC</kbd></button></div></header><main id="board" class="board" aria-label="Soundboard berdasarkan kategori"></main><footer><span>24 SLOTS · 18 ACTIVE · 6 MUSIC SLOTS READY</span><span id="status" aria-live="polite">Ready</span><span>POWERED BY KING BASKETBALL COMMUNITY</span></footer></div><script src="app.js"></script></body></html>
